name: Android APK checks

on:
  push:
    branches: [main, master]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.18+8'
      - name: Verify wrapper and release identity
        run: |
          sha256sum --check gradle/wrapper/gradle-wrapper.jar.sha256
          python3 scripts/check-release.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Install pinned Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'cmdline-tools;19.0'
          "$ANDROID_HOME/cmdline-tools/19.0/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test, lint and compile both APK variants
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease
      - name: Record artifact checksums and source
        run: |
          mkdir -p build/artifacts
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk > build/artifacts/SHA256SUMS
          git rev-parse HEAD > build/artifacts/source-commit.txt
          cp version.properties build/artifacts/
          java -version 2> build/artifacts/java-version.txt
          ./gradlew --version > build/artifacts/gradle-version.txt
      - name: Upload installable debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DebridBooks-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload unsigned release APK and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DebridBooks-unsigned-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/*.apk
            build/artifacts/
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Android-reports-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
