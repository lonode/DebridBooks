AntiFeatures:
  NonFreeNet:
    en-US: AllDebrid is a proprietary account-based network service used for torrent
      media resolution.
Categories:
  - Multimedia
  - Reading
License: AGPL-3.0-only
AuthorName: lonode
AuthorWebSite: https://github.com/lonode
SourceCode: https://github.com/lonode/DebridBooks
IssueTracker: https://github.com/lonode/DebridBooks/issues

AutoName: DebridBooks

RepoType: git
Repo: https://github.com/lonode/DebridBooks.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: 
    subdir: app
    sudo:
      - echo 'deb https://deb.debian.org/debian bookworm main' > /etc/apt/sources.list.d/db-jdk17.list
      - apt-get update
      - apt-get install -y --no-install-recommends openjdk-17-jdk-headless
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags ^[0-9]+\.[0-9]+\.[0-9]+$
UpdateCheckData: version.properties|versionCode=(\d+)|.|versionName=(.+)
CurrentVersion: 1.0.0
CurrentVersionCode: 1
